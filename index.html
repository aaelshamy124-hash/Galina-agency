<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galina Export Advisor AI - Global B2B Client Verification & Intelligence</title>
    <meta name="description" content="Galina Export Advisor AI - Authoritative, rapid international client verification and B2B export intelligence for IQF fruits, vegetables, and fresh produce." />
    <meta property="og:title" content="Galina Export Advisor AI" />
    <meta property="og:description" content="Rapid international client verification with live source checks, official websites, procurement contacts, and B2B produce export intelligence." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230d9488'><circle cx='12' cy='12' r='10'/></svg>" />
    <script>
      // 1. Ensure trailing slash for GitHub Pages repo path so relative assets resolve correctly
      (function() {
        var l = window.location;
        if (l.hostname.endsWith('github.io')) {
          var p = l.pathname;
          if (!p.endsWith('/') && !p.split('/').pop().includes('.')) {
            l.replace(p + '/' + l.search + l.hash);
          }
        }
      })();

      // 2. Smart Self-Healing Loader:
      // If /src/main.tsx fails to load (because GitHub Pages is serving static repository files directly without Vite dev server),
      // seamlessly load the pre-compiled production bundle from ./assets/app.js & ./assets/app.css!
      window.addEventListener('error', function(e) {
        var target = e.target || {};
        var src = target.src || '';

        if (target.tagName === 'SCRIPT' && src.indexOf('/src/main.tsx') !== -1) {
          if (e.preventDefault) e.preventDefault();
          console.warn("[Galina] Static host detected (/src/main.tsx not supported). Loading compiled production bundle...");

          // Calculate base path for current deployment (user page root or subpath repo)
          var path = window.location.pathname;
          var basePath = path.endsWith('/') ? path : path.substring(0, path.lastIndexOf('/') + 1);

          // 1. Inject production CSS
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = basePath + 'assets/index.css';
          document.head.appendChild(link);

          // 2. Inject production JS bundle
          var script = document.createElement('script');
          script.type = 'module';
          script.crossOrigin = 'anonymous';
          script.src = basePath + 'assets/app.js';
          script.onerror = function() {
            var loader = document.querySelector('.initial-loader');
            if (loader) {
              loader.innerHTML = '<div style="max-width:28rem;padding:2rem;background:#1e293b;border:1px solid #334155;border-radius:1rem;text-align:center;">' +
                '<div style="font-size:2rem;margin-bottom:0.75rem;">⚠️</div>' +
                '<h2 style="font-size:1.2rem;font-weight:bold;color:#f1f5f9;margin-bottom:0.5rem;">Bundle Loading Notice</h2>' +
                '<p style="font-size:0.8rem;color:#94a3b8;margin-bottom:1.25rem;">Could not load bundle at ' + script.src + '</p>' +
                '<button onclick="window.location.reload(true)" style="background:#0d9488;color:#fff;border:none;padding:0.6rem 1.25rem;border-radius:0.75rem;cursor:pointer;">Reload</button>' +
                '</div>';
            }
          };
          document.body.appendChild(script);
          return;
        }

        // Generic error handler
        var root = document.getElementById('root');
        var loader = root ? root.querySelector('.initial-loader') : null;
        if (loader && !loader.querySelector('#loader-err')) {
          var targetSrc = target.src || target.href || '';
          if (targetSrc.indexOf('/src/main.tsx') !== -1) return; // handled above

          var msg = e.message || (targetSrc ? 'Failed to load: ' + targetSrc : 'Initialization error');
          loader.innerHTML = '<div id="loader-err" style="max-width:28rem;padding:2rem;background:#1e293b;border:1px solid #334155;border-radius:1rem;text-align:center;">' +
            '<div style="font-size:2rem;margin-bottom:0.75rem;">⚠️</div>' +
            '<h2 style="font-size:1.2rem;font-weight:bold;color:#f1f5f9;margin-bottom:0.5rem;">Resource Loading Notice</h2>' +
            '<p style="font-size:0.8rem;color:#94a3b8;margin-bottom:1.25rem;line-height:1.4;">' + msg + '</p>' +
            '<button onclick="window.location.reload(true)" style="background:#0d9488;color:#fff;border:none;padding:0.6rem 1.25rem;border-radius:0.75rem;font-weight:600;font-size:0.85rem;cursor:pointer;">Reload Application</button>' +
            '</div>';
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Branded initial loading screen (replaced automatically once React mounts) -->
      <div class="initial-loader" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif;">
        <div style="text-align: center; padding: 2rem; max-width: 22rem;">
          <div style="width: 44px; height: 44px; border: 3px solid rgba(13, 148, 136, 0.2); border-top-color: #0d9488; border-radius: 50%; margin: 0 auto 1.25rem; animation: spin 0.8s linear infinite;"></div>
          <h2 style="font-size: 1.15rem; font-weight: 700; margin-bottom: 0.35rem; letter-spacing: -0.01em; color: #f1f5f9;">GALINA EXPORT ADVISOR AI</h2>
          <p style="font-size: 0.8rem; color: #94a3b8; letter-spacing: 0.02em;">Loading Global Export Intelligence Platform...</p>
        </div>
        <style>
          @keyframes spin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
