<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galina Export Advisor AI - Global B2B Client Verification & Intelligence</title>
    <meta name="description" content="Galina Export Advisor AI - Authoritative, rapid international client verification and B2B export intelligence for IQF fruits, vegetables, and fresh produce." />
    <meta property="og:title" content="Galina Export Advisor AI" />
    <meta property="og:description" content="Rapid international client verification with live source checks, official websites, procurement contacts, and B2B produce export intelligence." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230d9488'><circle cx='12' cy='12' r='10'/></svg>" />
    <script>
      // 1. Ensure trailing slash for GitHub Pages repo path so relative assets resolve correctly
      (function() {
        var l = window.location;
        if (l.hostname.endsWith('github.io')) {
          var p = l.pathname;
          if (!p.endsWith('/') && !p.split('/').pop().includes('.')) {
            l.replace(p + '/' + l.search + l.hash);
          }
        }
      })();

      // 2. Global capture-phase error listener (catches script/css 404 load failures)
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        var loader = root ? root.querySelector('.initial-loader') : null;
        if (loader) {
          var target = e.target || {};
          var src = target.src || target.href || '';
          var msg = e.message || (src ? 'Failed to load script resource: ' + src : 'Application initialization error');
          loader.innerHTML = '<div style="max-width:28rem;padding:2rem;background:#1e293b;border:1px solid #334155;border-radius:1rem;text-align:center;box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);">' +
            '<div style="width:3rem;height:3rem;border-radius:0.75rem;background:rgba(239,68,68,0.2);color:#f87171;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:1.5rem;font-weight:bold;">!</div>' +
            '<h2 style="font-size:1.2rem;font-weight:bold;color:#f1f5f9;margin-bottom:0.5rem;">Resource Loading Notice</h2>' +
            '<p style="font-size:0.8rem;color:#94a3b8;margin-bottom:1.25rem;line-height:1.4;">' + msg + '</p>' +
            '<button onclick="window.location.reload(true)" style="background:#0d9488;color:#fff;border:none;padding:0.6rem 1.25rem;border-radius:0.75rem;font-weight:600;font-size:0.85rem;cursor:pointer;width:100%;">Reload Application</button>' +
            '</div>';
        }
      }, true);

      // 3. Fallback watchdog: if app hasn't mounted after 5s, reveal manual retry notice
      setTimeout(function() {
        var notice = document.getElementById('loader-watchdog');
        if (notice && document.querySelector('.initial-loader')) {
          notice.style.display = 'block';
        }
      }, 5000);
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Branded initial loading screen (replaced automatically once React mounts) -->
      <div class="initial-loader" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif;">
        <div style="text-align: center; padding: 2rem; max-width: 22rem;">
          <div style="width: 44px; height: 44px; border: 3px solid rgba(13, 148, 136, 0.2); border-top-color: #0d9488; border-radius: 50%; margin: 0 auto 1.25rem; animation: spin 0.8s linear infinite;"></div>
          <h2 style="font-size: 1.15rem; font-weight: 700; margin-bottom: 0.35rem; letter-spacing: -0.01em; color: #f1f5f9;">GALINA EXPORT ADVISOR AI</h2>
          <p style="font-size: 0.8rem; color: #94a3b8; letter-spacing: 0.02em;">Loading Global Export Intelligence Platform...</p>

          <div id="loader-watchdog" style="display: none; margin-top: 1.5rem; padding: 0.75rem 1rem; background: #1e293b; border: 1px solid #334155; border-radius: 0.75rem;">
            <p style="font-size: 0.75rem; color: #94a3b8; margin-bottom: 0.5rem;">Connection delay detected. Tap below to reload:</p>
            <button onclick="window.location.reload(true)" style="background: #0d9488; color: #ffffff; border: none; padding: 0.4rem 0.8rem; border-radius: 0.5rem; font-size: 0.75rem; font-weight: 600; cursor: pointer; width: 100%;">Refresh Page</button>
          </div>
        </div>
        <style>
          @keyframes spin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
